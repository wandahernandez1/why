<!doctype html>
<html lang="es-AR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Demo iPhone · why</title>
  <meta name="robots" content="noindex, nofollow" />
  <style>
    /* ==========================================================================
       Demo de iPhone interactiva · un solo archivo, sin librerías externas.
       La pantalla mide 393 × 852 px (iPhone 15). Layout estilo iOS 17 con los colores del negocio.
       Colores: variables de :root. Textos y datos: bloque CONFIG en el <script>.
       ========================================================================== */

    :root {
      --principal: #b5d77b;
      --principal-oscuro: #c8e696;
      --principal-suave: #28332a;
      --secundario: #b5d77b;
      --fondo: #0b0d0c;
      --superficie: #171b18;
      --texto: #f4f6f3;
      --texto-suave: #c1c9c1;
      --separador: rgba(255, 255, 255, 0.15);
      --verde-wa: #203326;
      --fuente: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', system-ui, Roboto, sans-serif;
      --z: 1;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    [hidden] {
      display: none !important;
    }

    body {
      margin: 0;
      background: #0b0d0c;
      color: var(--texto);
      font-family: var(--fuente);
      -webkit-font-smoothing: antialiased;
    }

    button,
    select {
      font: inherit;
    }

    .ic {
      display: block;
      flex: none;
      fill: currentColor;
    }

    .escena {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
      padding: 32px 16px 48px;
    }

    .cartel {
      padding: 4px 12px;
      border: 1px solid #343c36;
      border-radius: 999px;
      color: #c1c9c1;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.14em;
    }

    .frase {
      margin: 0;
      color: #f4f6f3;
      font-size: 17px;
      font-weight: 600;
      text-align: center;
    }

    /* ---------- Marco del iPhone (solo CSS) ---------- */
    .iphone {
      position: relative;
      width: 417px;
      height: 876px;
      padding: 12px;
      border-radius: 62px;
      background: linear-gradient(145deg, #a9a9ae 0%, #4a4a4f 18%, #1c1c1e 50%, #6a6a70 82%, #2c2c2e 100%);
      box-shadow:
        inset 0 0 0 1.5px #7a7a80,
        inset 0 0 0 4px #0b0b0c,
        0 30px 60px rgba(43, 32, 33, 0.28);
      zoom: var(--z);
    }

    .boton-lado {
      position: absolute;
      width: 4px;
      border-radius: 2px;
      background: linear-gradient(90deg, #8e8e93, #3a3a40);
    }
    .boton-lado.izq-1 { left: -3px; top: 150px; height: 34px; }
    .boton-lado.izq-2 { left: -3px; top: 204px; height: 64px; }
    .boton-lado.izq-3 { left: -3px; top: 280px; height: 64px; }
    .boton-lado.der { right: -3px; top: 240px; height: 96px; }

    .pantalla {
      position: absolute;
      inset: 12px;
      overflow: hidden;
      border-radius: 50px;
      background: var(--fondo);
      color: var(--texto);
      isolation: isolate;
    }

    .isla {
      position: absolute;
      top: 11px;
      left: 50%;
      z-index: 50;
      width: 126px;
      height: 37px;
      transform: translateX(-50%);
      border-radius: 999px;
      background: #000;
      pointer-events: none;
    }

    /* ---------- Barra de estado ---------- */
    .estado {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      z-index: 45;
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 54px;
      padding: 6px 30px 0 46px;
      font-size: 17px;
      font-weight: 600;
      letter-spacing: -0.01em;
      transition: background 300ms ease, color 300ms ease;
    }
    .pantalla.en-chat .estado {
      background: var(--verde-wa);
      color: #fff;
    }
    .estado-iconos {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .estado-iconos .ic {
      width: 18px;
      height: 18px;
    }
    .senal {
      display: flex;
      align-items: flex-end;
      gap: 2px;
      height: 12px;
    }
    .senal i {
      width: 3px;
      border-radius: 1px;
      background: currentColor;
    }
    .senal i:nth-child(1) { height: 4px; }
    .senal i:nth-child(2) { height: 6px; }
    .senal i:nth-child(3) { height: 9px; }
    .senal i:nth-child(4) { height: 12px; }
    .bateria {
      position: relative;
      width: 27px;
      height: 13px;
      padding: 2px;
      border: 1px solid currentColor;
      border-radius: 4px;
      opacity: 0.9;
    }
    .bateria::after {
      position: absolute;
      top: 3.5px;
      right: -3px;
      width: 1.5px;
      height: 4px;
      border-radius: 0 1px 1px 0;
      background: currentColor;
      content: '';
    }
    .bateria span {
      display: block;
      width: 80%;
      height: 100%;
      border-radius: 2px;
      background: currentColor;
    }

    /* ---------- Área de la app ---------- */
    .app {
      position: absolute;
      top: 0;
      right: 0;
      bottom: 83px;
      left: 0;
      display: flex;
      flex-direction: column;
      padding-top: 54px;
    }
    .vistas {
      position: relative;
      flex: 1;
      min-height: 0;
    }
    .vista {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      animation: entrar 250ms ease;
    }
    .vista-scroll {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding: 0 0 16px;
      scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
    }
    .vista-scroll::-webkit-scrollbar {
      display: none;
    }

    /* Título grande estilo iOS */
    .cab {
      display: flex;
      flex: none;
      align-items: flex-end;
      justify-content: space-between;
      gap: 12px;
      padding: 4px 20px 10px;
    }
    .cab .eyebrow {
      margin: 0 0 2px;
      color: var(--principal);
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.01em;
    }
    .cab h2 {
      margin: 0;
      font-size: 34px;
      font-weight: 700;
      letter-spacing: -0.02em;
      line-height: 1.1;
    }
    .cab .sub {
      margin: 2px 0 0;
      color: var(--texto-suave);
      font-size: 14px;
    }
    .avatar-nav {
      display: grid;
      flex: none;
      width: 40px;
      height: 40px;
      place-items: center;
      border-radius: 50%;
      background: var(--principal);
      color: #10150e;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.02em;
    }

    /* Encabezados de sección y grupos inset (estilo Ajustes de iOS) */
    .seccion-titulo {
      margin: 20px 32px 7px;
      color: var(--texto-suave);
      font-size: 13px;
      font-weight: 400;
      text-transform: uppercase;
      letter-spacing: -0.08px;
    }
    .grupo {
      margin: 0 16px;
      padding: 0;
      border-radius: 12px;
      background: var(--superficie);
      overflow: hidden;
      list-style: none;
    }
    .fila {
      position: relative;
      display: flex;
      align-items: center;
      gap: 12px;
      min-height: 56px;
      padding: 8px 14px 8px 14px;
    }
    .fila + .fila::before {
      position: absolute;
      top: 0;
      left: 60px;
      right: 0;
      height: 0.5px;
      background: var(--separador);
      content: '';
    }
    .fila-texto {
      display: flex;
      flex: 1;
      flex-direction: column;
      min-width: 0;
    }
    .fila-texto strong {
      font-size: 17px;
      font-weight: 400;
      letter-spacing: -0.02em;
    }
    .fila-texto span {
      margin-top: 1px;
      color: var(--texto-suave);
      font-size: 13px;
    }
    .emoji-fila {
      flex: none;
      width: 40px;
      height: 40px;
      object-fit: contain;
    }

    /* ---------- Botones ---------- */
    .boton {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      min-height: 50px;
      padding: 0 16px;
      border: 0;
      border-radius: 14px;
      background: var(--principal);
      color: #10150e;
      font-size: 17px;
      font-weight: 600;
      letter-spacing: -0.02em;
      cursor: pointer;
      transition: background 200ms ease, transform 150ms ease, opacity 200ms ease;
    }
    .boton .ic {
      width: 22px;
      height: 22px;
    }
    .boton:hover:not(:disabled) {
      background: var(--principal-oscuro);
    }
    .boton:active:not(:disabled) {
      transform: scale(0.98);
    }
    .boton:disabled {
      background: #343c36;
      color: #a7b2a7;
      cursor: not-allowed;
    }

    .pie {
      display: grid;
      flex: none;
      gap: 10px;
      padding: 10px 16px 12px;
      background: rgba(20, 23, 21, 0.96);
      border-top: 0.5px solid var(--separador);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
    }
    .pie-total {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 10px;
      color: var(--texto-suave);
      font-size: 14px;
    }
    .pie-total strong {
      color: var(--texto);
      font-size: 20px;
      font-weight: 700;
      letter-spacing: -0.02em;
    }
    .pie-retiro {
      display: flex;
      align-items: center;
      gap: 10px;
      min-height: 40px;
      color: var(--texto);
      font-size: 15px;
    }
    .pie-retiro .ic {
      width: 20px;
      height: 20px;
      color: var(--principal);
    }
    .pie-retiro select {
      margin-left: auto;
      min-height: 32px;
      padding: 0 6px;
      border: 0;
      border-radius: 8px;
      background: transparent;
      color: var(--principal);
      font-weight: 600;
      font-size: 15px;
      cursor: pointer;
    }

    :focus-visible {
      outline: 3px solid var(--principal);
      outline-offset: 2px;
    }

    /* ---------- Tab bar inferior ---------- */
    .tabbar {
      position: absolute;
      right: 0;
      bottom: 0;
      left: 0;
      z-index: 30;
      display: flex;
      height: 83px;
      padding: 8px 14px 0;
      border-top: 0.5px solid var(--separador);
      background: rgba(20, 23, 21, 0.96);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
    }
    .tab {
      display: flex;
      flex: 1;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      padding: 0;
      border: 0;
      background: none;
      color: #a7b2a7;
      font-size: 10px;
      font-weight: 500;
      cursor: pointer;
      transition: color 200ms ease;
    }
    .tab .ic {
      width: 26px;
      height: 26px;
    }
    .tab[aria-selected='true'] {
      color: var(--principal);
    }
    .indicador-hogar {
      position: absolute;
      bottom: 8px;
      left: 50%;
      z-index: 31;
      width: 134px;
      height: 5px;
      transform: translateX(-50%);
      border-radius: 3px;
      background: #f4f6f3;
      pointer-events: none;
    }

    /* ---------- PEDIDOS ---------- */
    .fila.producto .info {
      display: flex;
      flex: 1;
      flex-direction: column;
      min-width: 0;
    }
    .fila.producto .info strong {
      font-size: 17px;
      font-weight: 400;
    }
    .fila.producto .info span {
      margin-top: 1px;
      color: var(--texto-suave);
      font-size: 14px;
    }
    .contador {
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .agregar {
      min-height: 32px;
      padding: 0 14px;
      border: 0;
      border-radius: 999px;
      background: var(--principal-suave);
      color: var(--principal);
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }
    .qty {
      display: grid;
      width: 32px;
      height: 32px;
      place-items: center;
      border: 0;
      border-radius: 50%;
      background: var(--principal-suave);
      color: var(--principal);
      cursor: pointer;
      transition: transform 150ms ease;
    }
    .qty .ic {
      width: 16px;
      height: 16px;
    }
    .qty:active {
      transform: scale(0.9);
    }
    .cant {
      min-width: 26px;
      font-size: 17px;
      font-weight: 600;
      text-align: center;
      font-variant-numeric: tabular-nums;
    }

    /* ---------- TURNOS ---------- */
    .opcion {
      width: 100%;
      border: 0;
      background: none;
      color: var(--texto);
      text-align: left;
      cursor: pointer;
    }
    .opcion .fila-texto b {
      margin-top: 1px;
      color: var(--texto-suave);
      font-size: 13px;
      font-weight: 400;
    }
    .precio {
      color: var(--texto-suave);
      font-size: 15px;
      white-space: nowrap;
    }
    .radio {
      display: grid;
      flex: none;
      width: 24px;
      height: 24px;
      place-items: center;
      border: 2px solid #c7c7cc;
      border-radius: 50%;
    }
    .opcion[aria-pressed='true'] .radio {
      border-color: var(--principal);
      background: var(--principal);
    }
    .opcion[aria-pressed='true'] .radio::after {
      width: 6px;
      height: 11px;
      margin-top: -2px;
      border: solid #10150e;
      border-width: 0 2.5px 2.5px 0;
      transform: rotate(45deg);
      content: '';
    }

    .dias {
      display: flex;
      gap: 8px;
      margin: 0;
      padding: 2px 16px 4px;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .dias::-webkit-scrollbar {
      display: none;
    }
    .dia {
      display: flex;
      flex: none;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      width: 56px;
      padding: 9px 0 10px;
      border: 0;
      border-radius: 14px;
      background: var(--superficie);
      color: var(--texto);
      cursor: pointer;
      transition: background 200ms ease, color 200ms ease;
    }
    .dia small {
      color: var(--texto-suave);
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
    }
    .dia strong {
      font-size: 22px;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
    }
    .dia[aria-pressed='true'] {
      background: var(--principal);
      color: #10150e;
    }
    .dia[aria-pressed='true'] small {
      color: #28332a;
    }

    .horas {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin: 0 16px;
    }
    .hora {
      min-height: 40px;
      border: 0;
      border-radius: 10px;
      background: var(--superficie);
      color: var(--texto);
      font-size: 15px;
      font-weight: 500;
      font-variant-numeric: tabular-nums;
      cursor: pointer;
      transition: background 200ms ease, color 200ms ease;
    }
    .hora[aria-pressed='true'] {
      background: var(--principal);
      color: #10150e;
    }
    .hora:disabled {
      background: #252a26;
      color: #889388;
      text-decoration: line-through;
      cursor: not-allowed;
    }

    .resumen-turno {
      margin: 0;
      color: var(--texto-suave);
      font-size: 14px;
      text-align: center;
    }
    .resumen-turno.listo {
      color: var(--texto);
      font-weight: 600;
    }

    /* ---------- PERFIL / LANDING PROFESIONAL ---------- */
    .perfil-hero {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin: 4px 16px 20px;
      padding: 24px 20px 22px;
      border-radius: 22px;
      background: linear-gradient(160deg, #25332a 0%, #21171c 100%);
      color: #fff;
      text-align: center;
    }
    .perfil-avatar {
      display: grid;
      width: 84px;
      height: 84px;
      place-items: center;
      border: 3px solid rgba(255, 255, 255, 0.85);
      border-radius: 50%;
      background: var(--secundario);
      color: #10150e;
      font-size: 28px;
      font-weight: 700;
    }
    .perfil-hero h3 {
      margin: 12px 0 2px;
      font-size: 21px;
      font-weight: 700;
      letter-spacing: -0.02em;
    }
    .perfil-hero p {
      margin: 0;
      color: #f1e3ea;
      font-size: 14px;
    }
    .disponible {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-top: 12px;
      padding: 5px 12px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.16);
      font-size: 13px;
      font-weight: 600;
    }
    .disponible i {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #34c759;
      box-shadow: 0 0 0 3px rgba(52, 199, 89, 0.3);
    }
    .fila .ic.marca {
      width: 22px;
      height: 22px;
      color: var(--principal);
    }
    .testimonio {
      display: block;
      padding: 14px 14px 14px;
    }
    .testimonio .estrellas {
      display: flex;
      gap: 2px;
      margin-bottom: 6px;
      color: var(--principal);
    }
    .testimonio .estrellas .ic {
      width: 14px;
      height: 14px;
    }
    .testimonio p {
      margin: 0;
      font-size: 15px;
      line-height: 1.35;
    }
    .testimonio small {
      display: block;
      margin-top: 6px;
      color: var(--texto-suave);
      font-size: 13px;
    }
    .perfil-cta {
      margin: 22px 16px 8px;
    }

    /* ---------- CHAT DE WHATSAPP SIMULADO ---------- */
    .chat {
      position: absolute;
      inset: 0;
      z-index: 40;
      display: flex;
      flex-direction: column;
      padding-top: 54px;
      background: #0b0d0c;
      animation: entrar 250ms ease;
    }
    .chat-cab {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 10px 10px;
      background: var(--verde-wa);
      color: #fff;
    }
    .chat-cab .logo {
      display: grid;
      flex: none;
      width: 36px;
      height: 36px;
      place-items: center;
      border-radius: 50%;
      background: var(--secundario);
      color: #10150e;
      font-size: 14px;
      font-weight: 700;
    }
    .chat-titulo {
      display: flex;
      flex: 1;
      min-width: 0;
      flex-direction: column;
    }
    .chat-titulo strong {
      overflow: hidden;
      font-size: 16px;
      font-weight: 600;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .chat-titulo small {
      color: #d1ece8;
      font-size: 12px;
    }
    .btn-reiniciar {
      display: flex;
      align-items: center;
      gap: 4px;
      min-height: 32px;
      padding: 0 10px;
      border: 0;
      border-radius: 999px;
      background: #b5d77b;
      color: #10150e;
      font-size: 13px;
      font-weight: 600;
      white-space: nowrap;
      cursor: pointer;
    }
    .btn-reiniciar .ic {
      width: 16px;
      height: 16px;
    }
    .chat-cuerpo {
      display: flex;
      flex: 1;
      min-height: 0;
      flex-direction: column;
      gap: 6px;
      overflow-y: auto;
      padding: 12px 12px 6px;
      scrollbar-width: none;
    }
    .burbuja {
      max-width: 82%;
      padding: 7px 10px 4px;
      border-radius: 10px;
      background: #252a26;
      color: #f4f6f3;
      box-shadow: 0 1px 1px rgba(0, 0, 0, 0.08);
      font-size: 15px;
      line-height: 1.35;
      white-space: pre-line;
      animation: aparecer 250ms ease;
    }
    .burbuja.salida {
      align-self: flex-end;
      background: #30482e;
    }
    .burbuja .meta {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 4px;
      margin-top: 2px;
      color: #c1c9c1;
      font-size: 11px;
    }
    .tick {
      letter-spacing: -2px;
    }
    .tick.leido {
      color: #b5d77b;
    }
    .escribiendo {
      display: inline-flex;
      gap: 4px;
      padding: 10px 12px;
    }
    .escribiendo i {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #8696a0;
      animation: puntos 1s infinite ease-in-out;
    }
    .escribiendo i:nth-child(2) { animation-delay: 0.15s; }
    .escribiendo i:nth-child(3) { animation-delay: 0.3s; }
    .chat-pie {
      margin: 0;
      padding: 10px 8px 26px;
      background: #171b18;
      color: #c1c9c1;
      font-size: 12px;
      text-align: center;
    }

    /* ---------- Animaciones ---------- */
    @keyframes entrar {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: none; }
    }
    @keyframes aparecer {
      from { opacity: 0; transform: translateY(6px) scale(0.98); }
      to { opacity: 1; transform: none; }
    }
    @keyframes puntos {
      0%, 80%, 100% { opacity: 0.3; transform: translateY(0); }
      40% { opacity: 1; transform: translateY(-3px); }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 1ms !important;
        transition-duration: 1ms !important;
      }
    }

  <script>
    // Con ?embed=1 la demo ocupa toda la pantalla del iPhone del home (iframe de 393 × 852).
    const embebido = new URLSearchParams(location.search).has('embed');
    if (embebido) {
      document.documentElement.classList.add('embed');
    } else {
      // Página sola: escala el iPhone para que entre en la ventana, sin perder proporciones.
      const ajustarEscala = () => {
        const z = Math.min(1, (innerWidth - 32) / 417, (innerHeight - 180) / 876);
        document.documentElement.style.setProperty('--z', Math.max(0.5, z).toFixed(3));
      };
      ajustarEscala();
      addEventListener('resize', ajustarEscala);
    }

    // ==========================================================================
    // CONFIGURACIÓN: editá solo este bloque para cambiar números, negocios y precios.
    // "icono" es el nombre de un emoji (ver el mapa EMOJIS más abajo).
    // ==========================================================================
    const CONFIG = {
      // Número de WhatsApp real, con código de país y sin + ni espacios. Ej: 5491155551234
      numeroWhatsapp: '549XXXXXXXXXX',
      moneda: 'ARS',

      pedidos: {
        negocio: 'Don Pepe',
        subtitulo: 'Pizzería · Retiro en local',
        productos: [
          { id: 'muzza', nombre: 'Muzzarella', precio: 9500, icono: 'pizza', categoria: 'Pizzas' },
          { id: 'napo', nombre: 'Napolitana', precio: 10500, icono: 'pizza', categoria: 'Pizzas' },
          { id: 'fugazzeta', nombre: 'Fugazzeta', precio: 10000, icono: 'pizza', categoria: 'Pizzas' },
          { id: 'empanadas', nombre: 'Empanadas x12', precio: 14000, icono: 'empanada', categoria: 'Para compartir' },
          { id: 'gaseosa', nombre: 'Gaseosa 1.5 L', precio: 3800, icono: 'bebida', categoria: 'Bebidas' },
        ],
        horariosRetiro: ['20:30', '21:00', '21:30', '22:00'],
      },

      turnos: {
        negocio: 'Barber Club',
        subtitulo: 'Barbería · Turnos online',
        servicios: [
          { id: 'corte', nombre: 'Corte', duracion: 30, precio: 8000, icono: 'tijera' },
          { id: 'barba', nombre: 'Barba', duracion: 20, precio: 5000, icono: 'barba' },
          { id: 'completo', nombre: 'Corte + barba', duracion: 50, precio: 12000, icono: 'barberia' },
        ],
        horaInicio: 9, // primer turno a las 9:00
        horaFin: 18, // último turno a las 17:30 (bloques de 30 min)
        diasAdelante: 7,
      },

      landing: {
        profesional: 'Lic. Mariana Ríos',
        especialidad: 'Kinesiología deportiva y rehabilitación',
        zona: 'Zona Norte · Atención en consultorio y a domicilio',
        servicios: [
          { titulo: 'Rehabilitación de lesiones', texto: 'Recuperá movilidad después de una lesión o cirugía.' },
          { titulo: 'Kinesiología deportiva', texto: 'Prevención y vuelta a la actividad física.' },
          { titulo: 'Masajes descontracturantes', texto: 'Alivio para espalda y cervicales.' },
        ],
        testimonios: [
          { texto: 'Me recuperé de la rodilla en seis semanas. Súper atenta y puntual.', nombre: 'Carla G.' },
          { texto: 'Hace años que sufro de la espalda y por fin siento alivio.', nombre: 'Julián P.' },
        ],
      },

      // Textos del mensaje que se arma al enviar (se combinan con los datos del usuario)
      mensajeWhatsappSitio: 'Hola! Vi la demo y quiero una web para mi negocio',
    };

    // ==========================================================================
    // Utilidades y estado
    // ==========================================================================
    const $ = (selector, ctx = document) => ctx.querySelector(selector);
    const fmt = new Intl.NumberFormat('es-AR', {
      style: 'currency',
      currency: CONFIG.moneda,
      maximumFractionDigits: 0,
    });
    const esperar = (ms) => new Promise((resolver) => setTimeout(resolver, ms));
    const iniciales = (nombre) =>
      nombre
        .replace(/^(Lic\.|Dr\.|Dra\.)\s+/, '')
        .split(/\s+/)
        .slice(0, 2)
        .map((p) => p[0])
        .join('')
        .toUpperCase();
    const horaActual = () => new Date().toLocaleTimeString('es-AR', { hour: '2-digit', minute: '2-digit', hour12: false });
    const icono = (nombre, clase = '') =>
      `<svg class="ic ${clase}" viewBox="0 0 256 256" aria-hidden="true"><use href="#i-${nombre}"/></svg>`;
    const EMOJIS = { pizza: '1F355', empanada: '1F967', bebida: '1F964', postre: '1F370', tijera: '2702', barberia: '1F488', barba: '1F9D4', color: '1F3A8', bolsa: '1F6CD', exito: '2705', lupa: '1F50D', calendario: '1F4C5' };
    const emoji = (nombre, clase = 'emoji-fila') => `<img class="${clase}" src="/openmoji/${EMOJIS[nombre] ?? nombre}.svg" alt="" width="40" height="40" loading="eager" decoding="async">`;

    const pantalla = $('#pantalla');
    const chat = $('#chat');
    const chatCuerpo = $('#chat-cuerpo');

    let carrito = {}; // id de producto -> cantidad
    let turno = { servicio: null, dia: null, hora: null }; // claves elegidas
    let sesion = 0; // se incrementa para cancelar simulaciones en curso

    // ==========================================================================
    // Render de encabezados y de cada pestaña
    // ==========================================================================
    function renderEncabezados() {
      const datos = { pedidos: CONFIG.pedidos, turnos: CONFIG.turnos };
      for (const [vista, d] of Object.entries(datos)) {
        const panel = $(`#vista-${vista}`);
        $('[data-inicial]', panel).textContent = iniciales(d.negocio);
        $('[data-nombre]', panel).textContent = d.negocio;
        $('[data-sub]', panel).textContent = d.subtitulo;
      }
      $('#select-retiro').innerHTML = CONFIG.pedidos.horariosRetiro
        .map((h) => `<option value="${h}">${h} hs</option>`)
        .join('');
    }

    function filaProducto(p, cant) {
      const controles = cant
        ? `<button class="qty" type="button" data-id="${p.id}" data-cambio="-1" aria-label="Quitar uno de ${p.nombre}">${icono('menos')}</button>
           <output class="cant" aria-label="Cantidad de ${p.nombre}">${cant}</output>
           <button class="qty" type="button" data-id="${p.id}" data-cambio="1" aria-label="Agregar uno de ${p.nombre}">${icono('mas')}</button>`
        : `<button class="agregar" type="button" data-id="${p.id}" data-cambio="1" aria-label="Agregar ${p.nombre}">Agregar</button>`;
      return `
        <li class="fila producto">
          ${emoji(p.icono)}
          <div class="info"><strong>${p.nombre}</strong><span>${fmt.format(p.precio)}</span></div>
          <div class="contador">${controles}</div>
        </li>`;
    }

    function renderPedidos() {
      const grupos = {};
      CONFIG.pedidos.productos.forEach((p) => {
        (grupos[p.categoria] = grupos[p.categoria] || []).push(p);
      });
      $('#lista-productos').innerHTML = Object.entries(grupos)
        .map(
          ([categoria, productos]) => `
          <h3 class="seccion-titulo">${categoria}</h3>
          <ul class="grupo">${productos.map((p) => filaProducto(p, carrito[p.id] || 0)).join('')}</ul>`,
        )
        .join('');
      actualizarCarritoPedidos();
    }

    function resumenPedido() {
      const items = CONFIG.pedidos.productos.filter((p) => carrito[p.id] > 0);
      const cantidad = items.reduce((suma, p) => suma + carrito[p.id], 0);
      const total = items.reduce((suma, p) => suma + carrito[p.id] * p.precio, 0);
      return { items, cantidad, total };
    }

    function actualizarCarritoPedidos() {
      const { cantidad, total } = resumenPedido();
      $('#carrito-resumen').textContent =
        cantidad === 0 ? 'Carrito vacío' : `${cantidad} ${cantidad === 1 ? 'producto' : 'productos'}`;
      $('#carrito-total').textContent = fmt.format(total);
      $('#btn-enviar-pedido').disabled = cantidad === 0;
    }

    function mensajePedido() {
      const { items, total } = resumenPedido();
      const lineas = items.map(
        (p) => `• ${carrito[p.id]} x ${p.nombre} (${fmt.format(carrito[p.id] * p.precio)})`,
      );
      return [
        `Hola ${CONFIG.pedidos.negocio}! 👋 Quiero hacer este pedido para retirar:`,
        ...lineas,
        '',
        `Total: ${fmt.format(total)}`,
        `Retiro: ${$('#select-retiro').value} hs`,
        'Gracias!',
      ].join('\n');
    }

    // Días y horarios de la demo. La ocupación es fija (no es un calendario real).
    function fechasDisponibles() {
      return Array.from({ length: CONFIG.turnos.diasAdelante }, (_, i) => {
        const d = new Date();
        d.setDate(d.getDate() + i);
        return d;
      });
    }

    function horariosDelDia() {
      const { horaInicio, horaFin } = CONFIG.turnos;
      const horas = [];
      for (let h = horaInicio; h < horaFin; h++) {
        horas.push(`${String(h).padStart(2, '0')}:00`, `${String(h).padStart(2, '0')}:30`);
      }
      return horas;
    }

    const estaOcupado = (indiceDia, indiceHora) => (indiceDia * 3 + indiceHora * 5) % 7 === 2;

    function renderTurnos() {
      $('#lista-servicios').innerHTML = CONFIG.turnos.servicios
        .map(
          (s) => `
          <button class="fila opcion" type="button" data-servicio="${s.id}" aria-pressed="${turno.servicio === s.id}">
            ${emoji(s.icono)}
            <span class="fila-texto"><strong>${s.nombre}</strong><b>${s.duracion} min</b></span>
            <span class="precio">${fmt.format(s.precio)}</span>
            <span class="radio" aria-hidden="true"></span>
          </button>`,
        )
        .join('');

      $('#lista-dias').innerHTML = fechasDisponibles()
        .map(
          (d, i) => `
          <button class="dia" type="button" data-dia="${i}" aria-pressed="${turno.dia === i}"
            aria-label="${d.toLocaleDateString('es-AR', { weekday: 'long', day: 'numeric', month: 'long' })}">
            <small>${d.toLocaleDateString('es-AR', { weekday: 'short' }).replace('.', '')}</small>
            <strong>${d.getDate()}</strong>
          </button>`,
        )
        .join('');

      $('#lista-horas').innerHTML = horariosDelDia()
        .map((hora, j) => {
          const ocupado = turno.dia !== null && estaOcupado(turno.dia, j);
          const etiqueta = ocupado ? `${hora}, ocupado` : hora;
          return `<button class="hora" type="button" data-hora="${hora}" aria-label="${etiqueta}"
            aria-pressed="${turno.hora === hora}" ${ocupado || turno.dia === null ? 'disabled' : ''}>${hora}</button>`;
        })
        .join('');

      actualizarResumenTurno();
    }

    function actualizarResumenTurno() {
      const { servicio, dia, hora } = turno;
      const listo = servicio && dia !== null && hora;
      const servicioObj = CONFIG.turnos.servicios.find((s) => s.id === servicio);
      const resumen = $('#turno-resumen');
      resumen.classList.toggle('listo', Boolean(listo));
      resumen.textContent = listo
        ? `${servicioObj.nombre} · ${fechasDisponibles()[dia].toLocaleDateString('es-AR', { weekday: 'short', day: 'numeric', month: 'short' })} · ${hora} hs`
        : 'Elegí servicio, día y horario';
      $('#btn-confirmar-turno').disabled = !listo;
    }

    function mensajeTurno() {
      const servicio = CONFIG.turnos.servicios.find((s) => s.id === turno.servicio);
      const fecha = fechasDisponibles()[turno.dia].toLocaleDateString('es-AR', {
        weekday: 'long',
        day: 'numeric',
        month: 'long',
      });
      return [
        `Hola ${CONFIG.turnos.negocio}! 👋 Quiero reservar un turno:`,
        `✂️ Servicio: ${servicio.nombre} (${servicio.duracion} min)`,
        `📅 Día: ${fecha}`,
        `🕒 Hora: ${turno.hora} hs`,
        `💲 Precio: ${fmt.format(servicio.precio)}`,
        '¿Me confirmás? Gracias!',
      ].join('\n');
    }

    function renderLanding() {
      const L = CONFIG.landing;
      $('#landing-contenido').innerHTML = `
        <section class="perfil-hero">
          <span class="perfil-avatar" aria-hidden="true">${iniciales(L.profesional)}</span>
          <h3>${L.profesional}</h3>
          <p>${L.especialidad}</p>
          <span class="disponible"><i aria-hidden="true"></i>Turnos esta semana</span>
        </section>
        <h3 class="seccion-titulo">Servicios</h3>
        <ul class="grupo">
          ${L.servicios
            .map(
              (s) => `<li class="fila">${icono('check', 'marca')}
                <span class="fila-texto"><strong>${s.titulo}</strong><span>${s.texto}</span></span></li>`,
            )
            .join('')}
        </ul>
        <h3 class="seccion-titulo">Lo que dicen</h3>
        <ul class="grupo">
          ${L.testimonios
            .map(
              (t) => `<li class="fila testimonio">
                <span class="estrellas" aria-label="5 estrellas">${icono('estrella').repeat(5)}</span>
                <p>“${t.texto}”</p><small>— ${t.nombre}</small></li>`,
            )
            .join('')}
        </ul>
        <h3 class="seccion-titulo">Zona de atención</h3>
        <ul class="grupo">
          <li class="fila">${icono('pin', 'marca')}<span class="fila-texto"><strong>${L.zona}</strong></span></li>
        </ul>
        <div class="perfil-cta">
          <button class="boton" type="button" data-consultar>
            ${icono('whatsapp')}Consultar por WhatsApp
          </button>
        </div>`;
    }

    // ==========================================================================
    // Pestañas
    // ==========================================================================
    function mostrarVista(nombre) {
      document.querySelectorAll('.tab').forEach((tab) => {
        const activa = tab.dataset.vista === nombre;
        tab.setAttribute('aria-selected', String(activa));
        tab.tabIndex = activa ? 0 : -1;
      });
      ['pedidos', 'turnos', 'landing'].forEach((v) => {
        $(`#vista-${v}`).hidden = v !== nombre;
      });
    }

    // ==========================================================================
    // Chat de WhatsApp simulado
    // ==========================================================================
    function burbuja(texto, tipo) {
      const el = document.createElement('div');
      el.className = `burbuja ${tipo}`;
      el.innerHTML = `<span class="texto"></span>
        <span class="meta"><span>${horaActual()}</span>${tipo === 'salida' ? '<span class="tick" aria-label="Enviado">✓</span>' : ''}</span>`;
      el.querySelector('.texto').textContent = texto;
      chatCuerpo.appendChild(el);
      chatCuerpo.scrollTop = chatCuerpo.scrollHeight;
      return el;
    }

    function marcarTicks(el, leido) {
      const tick = el.querySelector('.tick');
      if (!tick) return;
      tick.textContent = '✓✓';
      tick.classList.toggle('leido', leido);
      tick.setAttribute('aria-label', leido ? 'Leído' : 'Entregado');
    }

    function abrirChat({ nombre, mensaje, respuesta }) {
      const id = ++sesion;
      const estado = $('#chat-estado');
      $('#chat-nombre').textContent = nombre;
      $('#chat-logo').textContent = iniciales(nombre);
      chatCuerpo.innerHTML = '';
      estado.textContent = 'escribiendo…';
      chat.hidden = false;
      pantalla.classList.add('en-chat');
      chat.querySelector('#btn-reiniciar').focus();
      simularConversacion(id, mensaje, respuesta);
    }

    async function simularConversacion(id, mensaje, respuesta) {
      const estado = $('#chat-estado');
      await esperar(900);
      if (id !== sesion) return;
      const salida = burbuja(mensaje, 'salida');

      await esperar(600);
      if (id !== sesion) return;
      marcarTicks(salida, false);
      estado.textContent = 'en línea';

      await esperar(700);
      if (id !== sesion) return;
      marcarTicks(salida, false);
      const escribiendo = document.createElement('div');
      escribiendo.className = 'burbuja entrada escribiendo';
      escribiendo.setAttribute('aria-label', 'El negocio está escribiendo');
      escribiendo.innerHTML = '<i></i><i></i><i></i>';
      chatCuerpo.appendChild(escribiendo);
      chatCuerpo.scrollTop = chatCuerpo.scrollHeight;
      estado.textContent = 'escribiendo…';

      await esperar(1600);
      if (id !== sesion) return;
      escribiendo.remove();
      burbuja(respuesta, 'entrada');
      marcarTicks(salida, true);
      estado.textContent = 'en línea';
    }

    function reiniciarDemo() {
      sesion++; // cancela cualquier simulación en curso
      chat.hidden = true;
      pantalla.classList.remove('en-chat');
      carrito = {};
      turno = { servicio: null, dia: null, hora: null };
      $('#select-retiro').selectedIndex = 0;
      renderPedidos();
      renderTurnos();
      mostrarVista('pedidos');
    }

    // ==========================================================================
    // Eventos
    // ==========================================================================
    document.querySelector('.tabbar').addEventListener('click', (e) => {
      const tab = e.target.closest('.tab');
      if (tab) mostrarVista(tab.dataset.vista);
    });

    $('#lista-productos').addEventListener('click', (e) => {
      const boton = e.target.closest('[data-cambio]');
      if (!boton) return;
      const id = boton.dataset.id;
      const nuevo = (carrito[id] || 0) + Number(boton.dataset.cambio);
      if (nuevo > 0) carrito[id] = nuevo;
      else delete carrito[id];
      renderPedidos();
    });

    $('#btn-enviar-pedido').addEventListener('click', () => {
      abrirChat({
        nombre: CONFIG.pedidos.negocio,
        mensaje: mensajePedido(),
        respuesta: `¡Recibido! ✅ Te confirmamos el pedido en unos minutos. Gracias, ${CONFIG.pedidos.negocio}.`,
      });
    });

    $('#vista-turnos').addEventListener('click', (e) => {
      const servicio = e.target.closest('[data-servicio]');
      const dia = e.target.closest('[data-dia]');
      const hora = e.target.closest('[data-hora]');
      if (servicio) turno.servicio = servicio.dataset.servicio;
      if (dia) {
        turno.dia = Number(dia.dataset.dia);
        turno.hora = null; // al cambiar de día, el horario elegido puede estar ocupado
      }
      if (hora) turno.hora = hora.dataset.hora;
      if (servicio || dia || hora) renderTurnos();
    });

    $('#btn-confirmar-turno').addEventListener('click', () => {
      abrirChat({
        nombre: CONFIG.turnos.negocio,
        mensaje: mensajeTurno(),
        respuesta: 'Listo, turno confirmado ✅ Te esperamos. ¡Gracias por elegirnos!',
      });
    });

    $('#landing-contenido').addEventListener('click', (e) => {
      if (!e.target.closest('[data-consultar]')) return;
      abrirChat({
        nombre: CONFIG.landing.profesional,
        mensaje: `Hola ${CONFIG.landing.profesional}! Vi tu página y quiero consultar por una sesión.`,
        respuesta: '¡Hola! Gracias por escribir 🙌 Te respondemos a la brevedad.',
      });
    });

    $('#btn-reiniciar').addEventListener('click', reiniciarDemo);

    // Hora de la barra de estado (se actualiza cada 30 s)
    function actualizarHora() {
      $('#hora').textContent = horaActual();
    }

    // Enlace final a WhatsApp con el mensaje prearmado
    $('#cta').href = `https://wa.me/${CONFIG.numeroWhatsapp}?text=${encodeURIComponent(CONFIG.mensajeWhatsappSitio)}`;

    // ==========================================================================
    // Arranque
    // ==========================================================================
    renderEncabezados();
    renderPedidos();
    renderTurnos();
    renderLanding();
    actualizarHora();
    setInterval(actualizarHora, 30000);
  </script>
</body>
</html>
